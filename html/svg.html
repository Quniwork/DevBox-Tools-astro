<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Cleaner & Minifier Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    },
                    colors: {
                        // 自定義柔和的藍色系
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0f0fe',
                            500: '#60a5fa', // 更輕柔的藍
                            600: '#3b82f6',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)', // 自定義柔和陰影
                    }
                }
            }
        }
    </script>
    <style>
        /* Prevent layout shift */
        html { scrollbar-gutter: stable; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 20px; }
        .dark ::-webkit-scrollbar-thumb { background-color: #475569; }
    </style>
</head>
<body class="bg-[#f9fafb] text-gray-600 transition-colors duration-300 dark:bg-[#0f172a] dark:text-slate-300 min-h-screen flex flex-col font-sans">

    <header class="sticky top-0 z-20 backdrop-blur-xl bg-white/80 dark:bg-slate-900/90 border-b border-gray-100 dark:border-slate-800 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">

                <h1 class="text-xl font-bold tracking-tight flex items-center gap-2">
                    <span class="bg-clip-text bg-gradient-to-r from-blue-500 to-indigo-500 dark:from-blue-400 dark:to-indigo-400">SVG Cleaner & Minifier Tools</span>
                </h1>

                <div class="flex items-center gap-3 sm:gap-4">
                    <button id="themeToggle" class="p-2 rounded-xl bg-white dark:bg-slate-800 border border-gray-100 dark:border-slate-700 text-gray-400 dark:text-slate-400 hover:text-brand-600 dark:hover:text-blue-400 hover:border-brand-100 dark:hover:border-slate-600 transition-all shadow-sm">
                        <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                        <svg id="moonIcon" class="w-5 h-5 block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                    </button>
                </div>

            </div>
        </div>
    </header>

    <main class="flex-grow container max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 fade-in">
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-5 flex flex-col gap-6">
                <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-soft dark:shadow-none border border-gray-100 dark:border-slate-700 flex flex-col">
                    <label for="inputSvg" class="block text-sm font-medium mb-2 text-gray-500 dark:text-slate-400">原始 SVG 原始碼</label>
                    <textarea id="inputSvg" class="flex-grow w-full h-64 p-4 rounded-lg bg-gray-50 dark:bg-slate-900/50 border border-gray-100 dark:border-slate-700 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none font-mono text-xs leading-relaxed resize-none transition-all text-gray-600 dark:text-slate-300 placeholder-gray-400 dark:placeholder-slate-600" placeholder="請貼上 Figma 複製的 SVG 程式碼..."></textarea>
                </div>

                <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-soft dark:shadow-none border border-gray-100 dark:border-slate-700 space-y-4">
                    <div class="flex items-center">
                        <input id="removeSize" type="checkbox" class="w-4 h-4 text-gray-500 text-brand-600 bg-gray-100 border-gray-300 rounded focus:ring-brand-500 dark:focus:ring-brand-600 dark:ring-offset-slate-800 dark:bg-slate-700 dark:border-slate-600">
                        <label for="removeSize" class="ml-2 text-sm font-medium text-gray-500 dark:text-slate-300 select-none cursor-pointer">移除 width / height 屬性</label>
                    </div>

                    <div class="flex items-center gap-3">
                        <div class="flex items-center h-full">
                            <input id="enableClass" type="checkbox" checked class="w-4 h-4 text-brand-600 bg-gray-100 border-gray-300 rounded focus:ring-brand-500 dark:focus:ring-brand-600 dark:ring-offset-slate-800 dark:bg-slate-700 dark:border-slate-600">
                            <label for="enableClass" class="ml-2 text-xs font-medium text-gray-500 dark:text-slate-300 whitespace-nowrap select-none cursor-pointer">添加 Class</label>
                        </div>
                        <input type="text" id="className" value="ele-logo-img" class="w-full px-3 py-2 text-xs text-gray-500 bg-gray-50 rounded-lg border border-gray-200 focus:ring-brand-500 focus:border-brand-500 dark:bg-slate-900/50 dark:border-slate-600 dark:placeholder-slate-500 dark:text-slate-200 dark:focus:ring-brand-500 dark:focus:border-brand-500 transition-opacity" placeholder="輸入 class 名稱">
                    </div>
                </div>

                <button onclick="processSvg()" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-4 rounded-xl transition-all duration-200 shadow-lg shadow-brand-500/20 hover:shadow-brand-500/40 flex justify-center items-center gap-2 active:transform active:scale-[0.98]">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                    整理程式碼
                </button>
            </div>

            <div class="lg:col-span-7 flex flex-col gap-6">
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-soft dark:shadow-none border border-gray-100 dark:border-slate-700 flex-grow flex flex-col relative group">
                    <label for="outputSvg" class="block text-sm font-medium mb-2 text-gray-500 dark:text-gray-400 flex justify-between">
                        <span>整理結果</span>
                        <span class="text-xs text-brand-500 opacity-0 transition-opacity" id="copySuccessHint">已複製到剪貼簿</span>
                    </label>
                    <textarea id="outputSvg" readonly class="flex-grow w-full min-h-[400px] p-5 rounded-lg bg-gray-50 dark:bg-slate-900/50 border border-gray-100 dark:border-slate-700 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none font-mono text-xs leading-relaxed resize-none transition-all text-gray-600 dark:text-slate-300" placeholder="結果將顯示於此..."></textarea>
                </div>

                <button onclick="copyResult()" id="copyBtn" class="w-full font-semibold py-4 rounded-xl transition-all duration-200 border border-gray-200 dark:border-slate-700 bg-white text-gray-600 hover:bg-gray-50 hover:text-gray-900 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-white flex justify-center items-center gap-2 active:transform active:scale-[0.98]">
                    <svg id="copyIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    <span id="copyText">複製代碼</span>
                </button>
            </div>
        </div>

    </main>

    <script>
        // --- 1. Dark Mode Logic ---
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        const html = document.documentElement;

        function updateIcons() {
            if (html.classList.contains('dark')) {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
            updateIcons();
        });

        // Init Theme
        if (localStorage.getItem('theme') === 'light') {
            html.classList.remove('dark');
        }
        updateIcons();


        // --- 2. Input Logic (Class Checkbox) ---
        const enableClass = document.getElementById('enableClass');
        const classNameInput = document.getElementById('className');

        enableClass.addEventListener('change', (e) => {
            classNameInput.disabled = !e.target.checked;
            if (e.target.checked) {
                classNameInput.focus();
            }
        });


        // --- 3. Cleaning Logic ---
        function processSvg() {
            const input = document.getElementById('inputSvg').value;
            const outputEl = document.getElementById('outputSvg');
            const removeSize = document.getElementById('removeSize').checked;
            const addClass = document.getElementById('enableClass').checked;
            const className = document.getElementById('className').value.trim();

            if (!input.trim()) {
                outputEl.value = "";
                return;
            }

            let svg = input;

            // 1. 基本壓縮：移除換行與多餘空白
            svg = svg.replace(/[\r\n]+/g, '');
            svg = svg.replace(/\s+/g, ' ');
            svg = svg.replace(/>\s+</g, '><');

            // 2. 移除 width / height
            if (removeSize) {
                // 使用正則表達式移除 width="..." 和 height="..."
                svg = svg.replace(/\s(width|height)="[^"]*"/gi, '');
            }

            // 3. 處理 Class Name
            if (addClass && className) {
                // 先移除舊的 class (如果有的話)，避免重複
                svg = svg.replace(/\sclass="[^"]*"/gi, '');
                
                // 插入新的 class 到 <svg 標籤後
                // 確保插入後與下一個屬性有空格
                svg = svg.replace('<svg', `<svg class="${className}" `);
                
                // 整理可能產生的雙重空格
                svg = svg.replace(/\s+/g, ' '); 
                // 確保 > 前面沒有多餘空格 (美觀)
                svg = svg.replace(/\s>/g, '>'); 
            }

            outputEl.value = svg.trim();
        }


        // --- 4. Copy Logic ---
        function copyResult() {
            const outputEl = document.getElementById('outputSvg');
            const content = outputEl.value;

            if (!content) return;

            navigator.clipboard.writeText(content).then(() => {
                // UI Feedback
                const btn = document.getElementById('copyBtn');
                const icon = document.getElementById('copyIcon');
                const text = document.getElementById('copyText');
                const hint = document.getElementById('copySuccessHint');

                // Store original classes
                const originalBtnClass = "w-full font-semibold py-4 rounded-xl transition-all duration-200 border border-gray-200 dark:border-slate-700 bg-white text-gray-600 hover:bg-gray-50 hover:text-gray-900 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-white flex justify-center items-center gap-2 active:transform active:scale-[0.98]";
                const successBtnClass = "w-full font-semibold py-4 rounded-xl transition-all duration-200 border border-green-200 bg-green-50 text-green-600 hover:bg-green-100 flex justify-center items-center gap-2 active:transform active:scale-[0.98]";

                // Change State
                btn.className = successBtnClass;
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>';
                text.textContent = "已複製";
                
                // Show hint text
                hint.classList.remove('opacity-0');

                setTimeout(() => {
                    // Revert
                    btn.className = originalBtnClass;
                    icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>';
                    text.textContent = "複製代碼";
                    hint.classList.add('opacity-0');
                }, 2000);
            });
        }
    </script>
</body>
</html>
