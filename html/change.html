<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Cleaner Tools</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0f0fe',
                            500: '#60a5fa',
                            600: '#3b82f6',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 20px; }
        .dark ::-webkit-scrollbar-thumb { background-color: #475569; }

        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .code-preview { white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body class="bg-[#f9fafb] text-gray-600 transition-colors duration-300 dark:bg-[#0f172a] dark:text-slate-300 min-h-screen flex flex-col font-sans">

    <header class="sticky top-0 z-20 backdrop-blur-xl bg-white/80 dark:bg-slate-900/90 border-b border-gray-100 dark:border-slate-800 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">

                <h1 class="text-xl font-bold tracking-tight flex items-center gap-2">
                    <span class="bg-clip-text bg-gradient-to-r from-blue-500 to-indigo-500 dark:from-blue-400 dark:to-indigo-400">Color Cleaner Tools</span>
                </h1>

                <div class="flex items-center gap-3 sm:gap-4">

                    <button id="theme-toggle" class="p-2 rounded-xl bg-white dark:bg-slate-800 border border-gray-100 dark:border-slate-700 text-gray-400 dark:text-slate-400 hover:text-brand-600 dark:hover:text-blue-400 hover:border-brand-100 dark:hover:border-slate-600 transition-all shadow-sm">
                        <svg id="sun-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        <svg id="moon-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
                    </button>
                </div>

            </div>
        </div>
    </header>

    <div id="app" class="container max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow fade-in">
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-5 flex flex-col gap-6">
                
                <!-- Step 1: Config -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-soft dark:shadow-none border border-gray-100 dark:border-slate-700">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-sm font-medium text-gray-500 dark:text-white flex items-center gap-2">
                            <span class="bg-brand-50 text-brand-600 dark:bg-brand-900/30 dark:text-brand-300 px-2.5 py-0.5 rounded-md text-xs font-bold border border-brand-100 dark:border-brand-800">1</span>
                            配色定義 (:root)
                            <span v-if="currentThemeId" class="text-xs font-mono text-gray-400 dark:text-slate-500">#{{ currentThemeId }}</span>
                        </h2>
                        <div class="flex items-center gap-2">
                            <select 
                                v-model="selectedThemeId" 
                                @change="loadThemeConfig"
                                class="text-xs px-3 py-1.5 bg-white dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-lg text-gray-600 dark:text-slate-300 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none transition-all"
                                :disabled="loadingThemes"
                            >
                                <option value="">{{ loadingThemes ? '載入中...' : '選擇主題' }}</option>
                                <option v-for="theme in availableThemes" :key="theme.id" :value="theme.id">
                                    {{ theme.name }} ({{ theme.id }})
                                </option>
                            </select>
                            <button @click="loadDemoConfig" class="text-xs text-brand-600 dark:text-blue-400 hover:underline font-medium">範例</button>
                        </div>
                    </div>
                    <textarea 
                        v-model="colorConfigInput"
                        @input="onConfigInput"
                        placeholder="請貼上包含 --color-xxx 的 CSS 代碼..."
                        class="w-full h-40 p-4 text-[10px] font-mono bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 dark:focus:border-brand-500 outline-none resize-none text-gray-700 dark:text-slate-300 transition-all"
                    ></textarea>
                    
                    <div v-if="parsedColors.length > 0" class="mt-4 flex flex-wrap gap-2">
                        <div v-for="color in parsedColors" :key="color.name" 
                             class="flex items-center gap-2 text-[10px] bg-gray-50 dark:bg-slate-700/50 px-2 py-1 rounded-md border border-gray-100 dark:border-slate-600 text-gray-500 dark:text-slate-400"
                             :title="color.rgb">
                            <span class="w-2.5 h-2.5 rounded-full border border-gray-200 dark:border-slate-500 shadow-sm" :style="{ backgroundColor: `rgb(${color.rgb})` }"></span>
                            <span class="font-mono">{{ color.name }}</span>
                        </div>
                    </div>
                </div>

                <!-- Step 2: Figma Input -->
                <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-soft dark:shadow-none border border-gray-100 dark:border-slate-700">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-sm font-medium text-gray-500 dark:text-white flex items-center gap-2">
                            <span class="bg-gray-100 text-gray-600 dark:bg-slate-700 dark:text-slate-300 px-2.5 py-0.5 rounded-md text-xs font-bold border border-gray-200 dark:border-slate-600">2</span>
                            Figma 原始 CSS
                        </h2>
                        <button @click="clearInput" class="text-xs text-gray-400 hover:text-red-500 dark:hover:text-red-400 transition-colors">清空</button>
                    </div>
                    <textarea 
                        v-model="figmaInput"
                        placeholder="貼上 border-radius, background, box-shadow 等代碼..."
                        class="w-full h-48 p-4 text-xs font-mono bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 dark:focus:border-brand-500 outline-none resize-none text-gray-700 dark:text-slate-300 transition-all"
                    ></textarea>
                </div>

                <button 
                    @click="processCSS"
                    class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-4 rounded-xl transition-all duration-200 shadow-lg shadow-brand-500/20 hover:shadow-brand-500/40 flex justify-center items-center gap-2 active:transform active:scale-[0.98]">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                    執行自動整理
                </button>
            </div>

            <div class="lg:col-span-7 flex flex-col gap-6">
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-soft dark:shadow-none border border-gray-100 dark:border-slate-700 flex-grow flex flex-col relative group">
                    <div class="flex justify-between items-center mb-2 px-1">
                        <label class="block text-sm font-medium text-gray-500 dark:text-gray-400">整理結果</label>
                        <span class="text-xs text-brand-500 opacity-0 transition-opacity" :class="{ 'opacity-100': copied }">已複製到剪貼簿</span>
                    </div>
                    
                    <textarea 
                        readonly
                        :value="resultOutput"
                        placeholder="結果將顯示於此..."
                        class="flex-grow w-full min-h-[400px] p-5 text-xs font-mono text-gray-700 dark:text-slate-300 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-lg outline-none resize-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all"
                    ></textarea>
                </div>

                <button 
                    @click="copyResult"
                    class="w-full font-semibold py-4 rounded-xl transition-all duration-200 border border-gray-200 dark:border-slate-700 flex justify-center items-center gap-2 active:transform active:scale-[0.98]"
                    :class="{ 'bg-green-50 text-green-600 border-green-200 hover:bg-green-100': copied, 'bg-white text-gray-600 hover:bg-gray-50 hover:text-gray-900 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-white': !copied }"
                >
                    <svg v-if="!copied" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    <svg v-else class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    <span v-if="!copied">複製代碼</span>
                    <span v-else>已複製</span>
                </button>
            </div>

        </div>
    </div>

    <script>
        // --- Dark Mode Logic ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');

        function updateThemeIcon() {
            if (htmlElement.classList.contains('dark')) {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }

        // Init Theme
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }
        updateThemeIcon();

        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            localStorage.theme = htmlElement.classList.contains('dark') ? 'dark' : 'light';
            updateThemeIcon();
        });

        // --- Vue App ---
        const { createApp, ref, computed, watch } = Vue;

        createApp({
            setup() {
                // Google Apps Script API URL (與 theme.html 相同)
                const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxIwTeg20huQ4YnVtz5g1n48aujG-B_LgaHDWU1CxGDAmAKyR8loTCAWtNpJEh-wwWp6w/exec';
                
                // VAR_MAPPING (與 theme.html 相同)
                const VAR_MAPPING = {
                    "1": { key: "Var1_Pri", name: "主要顏色(1)", varName: 'primary' },
                    "2": { key: "Var2_Sec", name: "輔助顏色(2)", varName: 'secondary' },
                    "3": { key: "Var3_Ter", name: "次輔助顏色(3)", varName: 'tertiary' },
                    "4": { key: "Var4_Pri_Bg", name: "主背景顏色(4)", varName: 'primary-bg' },
                    "5": { key: "Var5_Sec_Bg", name: "輔助背景顏色(5)", varName: 'secondary-bg' },
                    "6": { key: "Var6_Ter_Bg", name: "次輔助背景顏色(6)", varName: 'tertiary-bg' },
                    "7": { key: "Var7_Pri_Text", name: "主文字顏色(7)", varName: 'primary-text' },
                    "8": { key: "Var8_Sec_Text", name: "輔助文字顏色(8)", varName: 'secondary-text' },
                    "9": { key: "Var9_Ter_Text", name: "輔助文字顏色(9)", varName: 'tertiary-text' },
                };

                // 預設範例資料
                const defaultColors = `:root[data-theme~="2501241"] {
    --color-primary:        54 115 254;      /* #3673FE */
    --color-primary-bg:     44 44 44;        /* #2C2C2C */
    --color-secondary-bg:   254 254 254;     /* #FEFEFE */
    --color-primary-text:   33 36 41;        /* #212429 */
    --color-secondary-text: 180 191 209;     /* #B4BFD1 */
}`;

                // 從 localStorage 讀取上次保存的配色或使用預設值
                const savedConfig = localStorage.getItem('colorConfig');
                const savedThemeId = localStorage.getItem('selectedThemeId');

                const colorConfigInput = ref(savedConfig || defaultColors);
                const figmaInput = ref('');
                const resultOutput = ref('');
                const copied = ref(false);
                const availableThemes = ref([]);
                const selectedThemeId = ref(savedThemeId || '');
                const currentThemeId = ref('');
                const loadingThemes = ref(true);

                // 輔助函數：Hex 轉 RGB 字串
                const hexToRgb = (hex) => {
                    const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
                    hex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
                    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                    return result ? `${parseInt(result[1], 16)} ${parseInt(result[2], 16)} ${parseInt(result[3], 16)}` : null;
                };

                // 從配色輸入中提取主題 ID
                const extractThemeId = (configText) => {
                    const match = configText.match(/data-theme~="([^"]+)"/);
                    return match ? match[1] : '';
                };

                // 監聽配色輸入變化，提取並更新當前主題 ID
                const onConfigInput = () => {
                    currentThemeId.value = extractThemeId(colorConfigInput.value);
                    // 保存到 localStorage
                    localStorage.setItem('colorConfig', colorConfigInput.value);
                };

                // 初始化時提取主題 ID
                currentThemeId.value = extractThemeId(colorConfigInput.value);

                // 從 API 載入主題列表
                const loadThemesList = async () => {
                    try {
                        loadingThemes.value = true;
                        const response = await fetch(GAS_API_URL);
                        const data = await response.json();
                        
                        // 從 config 和 list 建立主題列表
                        const themesMap = new Map();
                        
                        // 先從 config 取得主題名稱
                        data.config.forEach(item => {
                            if (item.Theme_Name) {
                                themesMap.set(item.Theme_Name, {
                                    name: item.Theme_Name,
                                    activeVars: item.Active_Variables 
                                        ? String(item.Active_Variables).split(/,|，/).map(s => s.trim())
                                        : []
                                });
                            }
                        });

                        // 從 list 取得具體的主題配色
                        const themes = [];
                        data.list.forEach(theme => {
                            const themeName = theme.Theme_Name;
                            const themeId = theme.Theme_Color;
                            const themeInfo = themesMap.get(themeName);
                            
                            if (themeInfo && themeId) {
                                themes.push({
                                    id: themeId,
                                    name: themeName,
                                    mode: theme.Theme_Mode,
                                    activeVars: themeInfo.activeVars,
                                    data: theme
                                });
                            }
                        });

                        availableThemes.value = themes;
                        
                        // 如果有保存的主題 ID，自動載入
                        if (savedThemeId && !savedConfig) {
                            selectedThemeId.value = savedThemeId;
                            loadThemeConfig();
                        }
                    } catch (error) {
                        console.error('載入主題列表失敗:', error);
                    } finally {
                        loadingThemes.value = false;
                    }
                };

                // 載入選擇的主題配色
                const loadThemeConfig = () => {
                    const themeId = selectedThemeId.value;
                    if (!themeId) return;

                    const theme = availableThemes.value.find(t => t.id === themeId);
                    if (!theme) return;

                    // 建立 CSS 配色定義
                    let cssConfig = `:root[data-theme~="${themeId}"] {\n`;
                    
                    const colorData = [];
                    theme.activeVars.forEach(vId => {
                        const mapping = VAR_MAPPING[vId];
                        if (mapping) {
                            const hexColor = theme.data[mapping.key];
                            if (hexColor) {
                                const rgbValue = hexToRgb(hexColor);
                                if (rgbValue) {
                                    colorData.push({
                                        varName: mapping.varName,
                                        rgb: rgbValue,
                                        hex: hexColor
                                    });
                                }
                            }
                        }
                    });

                    // 計算最大變數名稱長度以對齊
                    const maxVarNameLength = Math.max(
                        ...colorData.map(c => `--color-${c.varName}:`.length)
                    );

                    colorData.forEach(color => {
                        const paddedVarName = `--color-${color.varName}:`.padEnd(maxVarNameLength + 1);
                        cssConfig += `    ${paddedVarName}${color.rgb};`.padEnd(maxVarNameLength + 22) + `/* ${color.hex} */\n`;
                    });

                    cssConfig += `}`;

                    colorConfigInput.value = cssConfig;
                    currentThemeId.value = themeId;
                    
                    // 保存到 localStorage
                    localStorage.setItem('colorConfig', cssConfig);
                    localStorage.setItem('selectedThemeId', themeId);
                };

                const loadDemoConfig = () => {
                    colorConfigInput.value = defaultColors;
                    currentThemeId.value = extractThemeId(defaultColors);
                    selectedThemeId.value = '';
                    localStorage.setItem('colorConfig', defaultColors);
                    localStorage.removeItem('selectedThemeId');
                };

                const clearInput = () => {
                    figmaInput.value = '';
                };

                // 解析設定檔中的顏色
                const parsedColors = computed(() => {
                    const lines = colorConfigInput.value.split('\n');
                    const colors = [];
                    const regex = /(--[\w-]+):\s*(\d+\s+\d+\s+\d+)/;

                    lines.forEach(line => {
                        const match = line.match(regex);
                        if (match) {
                            const name = match[1];
                            const rgbStr = match[2].trim();
                            const rgbArr = rgbStr.split(/\s+/).map(Number);
                            
                            colors.push({
                                name: name,
                                rgb: rgbStr,
                                r: rgbArr[0],
                                g: rgbArr[1],
                                b: rgbArr[2]
                            });
                        }
                    });
                    return colors;
                });

                // 輔助功能：Hex 轉 RGB Object (用於顏色匹配)
                const hexToRgbObject = (hex) => {
                    const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
                    hex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
                    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                    return result ? {
                        r: parseInt(result[1], 16),
                        g: parseInt(result[2], 16),
                        b: parseInt(result[3], 16)
                    } : null;
                };

                // 輔助功能：比較兩個 RGB 是否相同
                const isColorMatch = (c1, c2) => {
                    return c1.r === c2.r && c1.g === c2.g && c1.b === c2.b;
                };

                // 核心邏輯：處理 CSS
                const processCSS = () => {
                    let css = figmaInput.value;
                    if (!css) return;

                    // 步驟 1: 清洗 Figma 的變數包裹 var(--name, VALUE) -> 變成 VALUE
                    // 使用 Regex 遞迴尋找並替換，直到沒有符合的為止 (處理巢狀)
                    // 這裡簡化處理：Figma 通常是 var(--name, #hex) 或 var(--name, rgba(...))
                    // 我們使用 replace callback 來抓取逗號後面的內容
                    
                    // 策略：先將所有 `var(--[^,]+,\s*(.+?))\)` 替換成 `$1`
                    // 由於 JS 正則不支援平衡群組，我們假設 Figma 不會產生太複雜的巢狀括號，主要抓取最後一個逗號後的內容
                    // 更好的方式：針對常見模式進行清洗
                    
                    // 1.1 處理 Hex 變數 (包含 6 位和 8 位): var(--xxx, #123456) 或 var(--xxx, #12345678) -> #123456 或 #12345678
                    css = css.replace(/var\(--[^,]+,\s*(#[0-9a-fA-F]{6,8})\)/g, '$1');
                    
                    // 1.2 處理 RGBA 變數: var(--xxx, rgba(...)) -> rgba(...)
                    // 這裡比較麻煩，因為 rgba 裡面有逗號。
                    // 我們改用一個通用的清洗邏輯：尋找顏色特徵
                    
                    // 定義一個 replacer 函數來處理每一行或每個數值
                    const processValue = (val) => {
                        // 1. 嘗試尋找 RGBA: rgba(54, 115, 254, 0.3)
                        // 2. 嘗試尋找 Hex: #3673FE 或 #FC45474D
                        // 3. 嘗試尋找 Figma 變數包裹
                        
                        // 我們先處理 "Figma Wrap"，把 var(..., inner) 剝殼
                        // 使用迴圈直到沒有變數包裹
                        while (/var\(--[^,)]+,\s*([^)]+)\)/.test(val)) {
                             val = val.replace(/var\(--[^,)]+,\s*(rgba?\(.*?\)|#[0-9a-fA-F]+)\)/g, '$1');
                        }

                        // 現在 val 應該是很乾淨的 rgba(...) 或 #hex
                        
                        // ---------------------------
                        // 處理 8 位 Hex (帶透明度): #FC45474D
                        // ---------------------------
                        val = val.replace(/#[0-9a-fA-F]{8}\b/g, (match) => {
                            // 前 6 位是顏色，後 2 位是透明度
                            const colorHex = match.substring(0, 7); // #FC4547
                            const alphaHex = match.substring(7, 9); // 4D
                            
                            const rgbObj = hexToRgbObject(colorHex);
                            const matchedVar = parsedColors.value.find(c => isColorMatch(c, rgbObj));
                            
                            // 將 hex 透明度轉換為百分比
                            const alphaDecimal = parseInt(alphaHex, 16) / 255;
                            const alphaPercent = Math.round(alphaDecimal * 100);
                            
                            let alphaPart = '';
                            if (alphaPercent < 100) {
                                alphaPart = ` / ${alphaPercent}%`;
                            }
                            
                            if (matchedVar) {
                                return `rgb(var(${matchedVar.name})${alphaPart})`;
                            }
                            // 沒對應到變數，轉為現代 RGB
                            return `rgb(${rgbObj.r} ${rgbObj.g} ${rgbObj.b}${alphaPart})`;
                        });

                        // ---------------------------
                        // 處理 6 位 Hex: #3673FE
                        // ---------------------------
                        val = val.replace(/#[0-9a-fA-F]{6}\b/g, (match) => {
                            const rgbObj = hexToRgbObject(match);
                            const matchedVar = parsedColors.value.find(c => isColorMatch(c, rgbObj));
                            
                            if (matchedVar) {
                                return `rgb(var(${matchedVar.name}))`;
                            }
                            // 沒對應到變數，轉為現代 RGB
                            return `rgb(${rgbObj.r} ${rgbObj.g} ${rgbObj.b})`;
                        });

                        // ---------------------------
                        // 處理 RGBA: rgba(54, 115, 254, 0.30)
                        // ---------------------------
                        val = val.replace(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([0-9.]+))?\)/g, (match, r, g, b, a) => {
                            const currentRgb = { r: parseInt(r), g: parseInt(g), b: parseInt(b) };
                            const matchedVar = parsedColors.value.find(c => isColorMatch(c, currentRgb));
                            
                            let alphaPart = '';
                            if (a !== undefined) {
                                // 轉換 Alpha: 0.30 -> 30%
                                const alphaPercent = Math.round(parseFloat(a) * 100);
                                // 如果是 100% 則不顯示，否則顯示 / 30%
                                if (alphaPercent < 100) {
                                    alphaPart = ` / ${alphaPercent}%`;
                                }
                            }

                            if (matchedVar) {
                                return `rgb(var(${matchedVar.name})${alphaPart})`;
                            } else {
                                // 沒對應到變數，單純轉格式
                                return `rgb(${r} ${g} ${b}${alphaPart})`;
                            }
                        });

                        return val;
                    };

                    resultOutput.value = processValue(css);
                };

                const copyResult = () => {
                    if (!resultOutput.value) return;
                    navigator.clipboard.writeText(resultOutput.value).then(() => {
                        copied.value = true;
                        setTimeout(() => copied.value = false, 2000);
                    });
                };

                // 頁面載入時載入主題列表
                loadThemesList();

                return {
                    colorConfigInput,
                    figmaInput,
                    resultOutput,
                    parsedColors,
                    processCSS,
                    loadDemoConfig,
                    loadThemeConfig,
                    onConfigInput,
                    clearInput,
                    copyResult,
                    copied,
                    availableThemes,
                    selectedThemeId,
                    currentThemeId,
                    loadingThemes
                };
            }
        }).mount('#app');
    </script>

</body>
